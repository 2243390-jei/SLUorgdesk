<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style/analytics.css">
    <title>OSAS Analytics Dashboard</title>
</head>
<body>
  <div class="app">
    <aside class="leftbar" aria-label="Main navigation">
      <div class="brand">
        <img src="../Images/SLU_logo.png" alt="SLU Logo" class="logo">
      </div>

      <nav class="left-nav" role="navigation" aria-label="Sidebar">
        <a href="../osas/calendar.html">
          <button class="circle-btn" title="Calendar" aria-label="Calendar">
            <img src="../Images/calendar.png" alt="Calendar" class="nav-icon">
          </button>
        </a>
        <a href="../osas/orgs.html">
          <button class="circle-btn" title="Organizations" aria-label="Organizations">
            <img src="../Images/group.png" alt="Organizations" class="nav-icon">
          </button>
        </a>
        <a href="../osas/analytics.html">
          <button class="circle-btn active" title="Analytics" aria-label="Analytics">
            <img src="../Images/analytics.png" alt="Analytics" class="nav-icon">
          </button>
        </a>
      </nav>
    </aside>  

    <main class="main-area" role="main">
      <header class="header">
        <div class="greeting">
          <h1>Hello, OSAS</h1>
          <div class="muted">Here are all the student organizations inside of Saint Louis University</div>
        </div>

        <div class="top-actions">
          <div class="search-wrap">
            <input id="searchInput" type="search" placeholder="Search an Organization" aria-label="Search an Organization" />
            <button id="searchClear" title="Clear" aria-label="Clear search">✕</button>
          </div>
          <div class="profile-header">
            <div class="profile-circle">M</div>
          </div>
        </div>
      </header>

      <div class="body">
        <!-- Stats Overview Cards - COMPLETELY REMOVED -->

        <div class="charts-row">
          <div class="orgs-section">
            <div class="section-header">
              <h2>Top Active Organizations</h2>
            </div>
            <div class="orgs-list" id="orgsList">
              <!-- Organizations will be populated by JavaScript -->
            </div>
          </div>

          <div class="charts-section">
            <div class="chart-card">
              <div class="chart-header">
                <h3>Monthly Submissions</h3>
              </div>
              <div class="chart-container">
                <canvas id="submissionsChart"></canvas>
                <div class="chart-hover-info" id="submissionsHover"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="charts-row">
          <div class="chart-full">
            <div class="chart-card">
              <div class="chart-header">
                <h2>SDG Submissions</h2>
                <div class="sdg-stats">
                  <span class="sdg-count" id="sdgSubmissions">0 Events</span>
                  <span class="sdg-goals" id="sdgGoals">0 Goals</span>
                </div>
              </div>
              <div class="chart-container-large">
                <canvas id="sdgChart"></canvas>
                <div class="chart-hover-info" id="sdgHover"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="charts-row">
          <div class="chart-full">
            <div class="chart-card">
              <div class="chart-header">
                <h2>Submissions by School</h2>
              </div>
              <div class="chart-container-large">
                <canvas id="schoolsChart"></canvas>
                <div class="chart-hover-info" id="schoolsHover"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  
  <script src="../script/analytics.js"></script>
</body>
</html>
