<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style/analytics.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>OSAS Analytics Dashboard</title>
</head>
<body>
  <div class="app">
    <aside class="leftbar" aria-label="Main navigation">
      <div class="brand">
        <div class="logo">OSAS</div>
      </div>

      <nav class="left-nav" role="navigation" aria-label="Sidebar">
        <button class="circle-btn active" title="Organizations" aria-label="Organizations">
          <img src="/Images/grid.png" alt="Organizations" class="nav-icon">
        </button>
        <button class="circle-btn" title="Calendar" aria-label="Calendar">
          <img src="/Images/calendar.png" alt="Calendar" class="nav-icon">
        </button>
        <button class="circle-btn" title="Email" aria-label="Email">
          <i class="fa-regular fa-envelope"></i>
        </button>
        <button class="circle-btn" title="Form List" aria-label="Form List">
          <i class="fa-solid fa-list-check"></i>
        </button>
        <button class="circle-btn" title="View All Users" aria-label="View All Users">
          <i class="fa-solid fa-users"></i>
        </button>
      </nav>
    </aside>  

    <main class="main-area" role="main">
      <header class="header">
        <div class="greeting">
          <h1>Hello, OSAS</h1>
          <div class="muted">Here are all the student organizations inside of Saint Louis University</div>
        </div>

        <div class="top-actions">
          <div class="search-wrap">
            <input id="searchInput" type="search" placeholder="Search an Organization" aria-label="Search an Organization" />
            <button id="searchClear" title="Clear" aria-label="Clear search">✕</button>
          </div>
          <div class="profile-header">
            <div class="profile-circle">M</div>
          </div>
        </div>
      </header>

      <div class="body">
        <div class="stats-container">
          <div class="stats-card">
            <h2>Top Active Organizations</h2>
            <div class="orgs-list" id="orgsList">
              <!-- Will be populated by JavaScript -->
            </div>
          </div>
          
          <div class="stats-card">
            <h2>Monthly Events</h2>
            <canvas id="eventsChart"></canvas>
          </div>
        </div>
        
        <div class="stats-container">
          <div class="stats-card full-width">
            <h2>SDG Submissions</h2>
            <canvas id="sdgChart"></canvas>
          </div>
        </div>
      </div>
    </main>
  </div>
  
  <script src="../script/analytics.js"></script>
</body>
</html>
