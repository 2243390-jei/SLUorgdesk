<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Organization Submissions</title>
  <link rel="stylesheet" href="../style/OSASsubmissions.css" />
  <script src="../script/OSASsubmissions.js" defer></script>
</head>
<body>
  <div class="app">
    <aside class="leftbar" aria-label="Main navigation">
      <div class="brand">
        <img src="../Images/SLU_logo.png" alt="SLU Logo" class="logo">
      </div>
      <nav class="left-nav" role="navigation" aria-label="Sidebar">
        <a href="../osas/calendar.html">
          <button class="circle-btn" title="Calendar" aria-label="Calendar">
            <img src="../Images/calendar.png" alt="Calendar" class="nav-icon">
          </button>
        </a>
        <a href="../osas/orgs.html">
          <button class="circle-btn" title="Organizations" aria-label="Organizations">
            <img src="../Images/group.png" alt="Organizations" class="nav-icon">
          </button>
        </a>
        <a href="../osas/analytics.html">
          <button class="circle-btn active" title="Analytics" aria-label="Analytics">
            <img src="../Images/statistics.png" alt="Analytics" class="nav-icon">
          </button>
        </a>
      </nav>
    </aside>  
    
    <main class="main-area">
      <header class="header">
        <div class="greeting">
          <h1>Organization Submissions</h1>
          <div class="muted">Viewing submissions for selected organization</div>
        </div>

        <div class="header-right">
          <div class="org-name-display" id="orgNameDisplay"></div>
          <div class="filter-container">

            <!-- 🔍 Search Bar -->
            <div class="search-container">
              <input type="text" id="searchInput" placeholder="Search event..." aria-label="Search event">
            </div>

            <!-- Filter Toggle Button -->
            <button id="filterToggle" class="filter-btn" title="Filter" aria-label="Filter">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
                <path d="M10 18h4v-2h-4v2zm-7-8v2h18v-2H3zm3-6v2h12V4H6z"/>
              </svg>
            </button>

            <div id="filterDropdown" class="filter-dropdown hidden">
              <button class="filter-category">Category</button>
              <div class="filter-sub hidden" data-type="category">
                <button>Workshop</button>
                <button>Program</button>
                <button>Seminar</button>
              </div>

              <button class="filter-category">Location</button>
              <div class="filter-sub hidden" data-type="location">
                <button data-sub="Maryheights">Maryheights ▸</button>
                <div class="filter-sub2 hidden" data-parent="Maryheights">
                  <button>Maryheights AVR</button>
                  <button>Maryheights Lobby</button>
                  <button>Maryheights Amphitheater</button>
                  <button>Maryheights Oval</button>
                </div>

                <button data-sub="Main Campus">Main Campus ▸</button>
                <div class="filter-sub2 hidden" data-parent="Main Campus">
                  <button>Main Campus CCA</button>
                  <button>Main Campus Lobby</button>
                  <button>Diego Silang Building</button>
                  <button>Dr. Konrad Adenauer Science Building</button>
                  <button>Dr. Jose P. Rizal Building</button>
                  <button>Otto Hahn Engineering Building</button>
                  <button>Msgr. Charles Vath Library Building</button>
                </div>
              </div>

              <button class="filter-category">SDG Category</button>
              <div class="filter-sub hidden" data-type="sdg">
                <button>SDG 1 - No Poverty</button>
                <button>SDG 2 - Zero Hunger</button>
                <button>SDG 3 - Good Health and Well-being</button>
                <button>SDG 4 - Quality Education</button>
                <button>SDG 5 - Gender Equality</button>
                <button>SDG 6 - Clean Water and Sanitation</button>
                <button>SDG 7 - Affordable and Clean Energy</button>
                <button>SDG 8 - Decent Work and Economic Growth</button>
                <button>SDG 9 - Industry, Innovation and Infrastructure</button>
                <button>SDG 10 - Reduced Inequalities</button>
                <button>SDG 11 - Sustainable Cities and Communities</button>
                <button>SDG 12 - Responsible Consumption and Production</button>
                <button>SDG 13 - Climate Action</button>
                <button>SDG 14 - Life Below Water</button>
                <button>SDG 15 - Life on Land</button>
                <button>SDG 16 - Peace, Justice and Strong Institutions</button>
                <button>SDG 17 - Partnerships for the Goals</button>
              </div>
              
              <div class="filter-clear">
                <button id="clearFilterBtn">Clear Filter</button>
              </div>
            </div>
          </div>
        </div>
      </header>

      <div id="submissionsContainer">
        <!-- Table to be inserted by OSASsubmissions.js -->
      </div>
    </main>
  </div>
</body>
</html>
