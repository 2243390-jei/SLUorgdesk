<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../style/submissionFullDetails.css" />
  <script src="../script/submissionFullDetails.js" defer></script>
  <title>Full Details</title>
</head>

<body>
  <div class="app">
    <aside class="leftbar" aria-label="Main navigation">
      <div class="brand">
        <div class="logo">SLU</div>
      </div>

      <nav class="left-nav" role="navigation" aria-label="Sidebar">
        <a href="../osas/calendar.html">
          <button class="circle-btn active" title="Calendar" aria-label="Calendar">
            <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z" />
            </svg>
          </button>
        </a>

        <a href="../osas/orgs.html">
          <button class="circle-btn" title="Organizations" aria-label="Organizations">
            <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0 4h2v-2H3v2zm12 0h2v-2h-2v2zm-6 0h2v-2h-2v2zm-6 0h2v-2H3v2zm0-4h2v-2H3v2zm6 0h2v-2H9v2zm6 0h2v-2h-2v2zm0-4
                h2v-2h-2v2zm-6 0h2v-2H9v2zm-6 0h2v-2H3v2zm12-4h2V7h-2v2zm-6 0h2V7H9v2zm-6 0h2V7H3v2zm12-4h2V3h-2v2zm-6 0h2V3H9v2zm-6 0h2V3H3v2z" />
            </svg>
          </button>
        </a>

        <button class="circle-btn" title="Email" aria-label="Email">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z" />
          </svg>
        </button>

        <button class="circle-btn" title="Form List" aria-label="Form List">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z" />
          </svg>
        </button>

        <button class="circle-btn" title="View All Users" aria-label="View All Users">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M16 4c0-1.11.89-2 2-2s2 .89 2 2-.89 2-2 2-2-.89-2-2zm4 18v-6h2.5l-2.54-7.63A3.02 3.02 0 0 0 16.95 6h-2.2c-.79 0-1.53.43-1.92 1.13L10.5 16H7v8h2v-6h2.22l2.76-8.27c.12-.36.46-.61.85-.61h2.29c.31 0 .6.14.78.38L19 13.63V22h2zM0 20v-8h2v8H0zm6-12c0-1.66
              1.34-3 3-3s3 1.34 3 3-1.34 3-3 3-3-1.34-3-3z" />
          </svg>
        </button>
      </nav>
    </aside>

    <main class="main-area" role="main">
      <div class="container">
        <h1>Event Submission Details</h1>
        <p>Below are the details of the selected organization's event submission.</p>

        <!-- Organization Info -->
        <section class="form-section">
          <h2>Organization Information</h2>
          <div class="details-grid">
            <div><label>Organization Name:</label><p id="orgName"></p></div>
            <div><label>Acronym:</label><p id="orgAcronym"></p></div>
            <div><label>Email:</label><p id="orgEmail"></p></div>
            <div><label>Academic Year:</label><p id="academicYear"></p></div>
            <div><label>Semester:</label><p id="semester"></p></div>
          </div>
        </section>

        <!-- Event Info -->
        <section class="form-section">
          <h2>Event Information</h2>
          <div class="details-grid">
            <div><label>Event Name:</label><p id="eventName"></p></div>
            <div><label>Event Type:</label><p id="eventType"></p></div>
            <div><label>Date:</label><p id="eventDate"></p></div>
            <div><label>Start Time:</label><p id="startTime"></p></div>
            <div><label>End Time:</label><p id="endTime"></p></div>
            <div><label>Venue:</label><p id="eventVenue"></p></div>
            <div><label>Attendance:</label><p id="attendance"></p></div>
            <div><label>SDG Goals:</label><p id="eventSDG"></p></div>
          </div>
          <div class="description">
            <label>Description:</label>
            <p id="eventDescription"></p>
          </div>
        </section>

        <!-- Documents -->
        <section class="form-section">
          <h2>Documents</h2>
          <div class="details-grid">
            <div><label>Event Proof:</label><a id="eventProof" target="_blank">View File</a></div>
          </div>
          <label>Supporting Documents:</label>
          <ul id="supportingDocumentsList"></ul>
        </section>

        <!-- Buttons -->
        <div class="btn-container">
          <button onclick="window.history.back()">← Back</button>
          <button id="commentRevisionsBtn">Comment Revisions</button>
        </div>

        <!-- Modal -->
        <div id="commentModal" class="modal">
          <div class="modal-content">
            <span class="close-btn" id="closeModal">&times;</span>
            <h2>Write your comment for revisions:</h2>
            <textarea id="revisionComment" placeholder="Type your comment here..."></textarea>
            <div class="modal-actions">
              <button id="submitComment">Submit Comment</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
