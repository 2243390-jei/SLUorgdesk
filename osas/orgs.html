<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style/OSASorgs.css">                                                                                                              
    <script src="../script/OSASorgs.js" defer></script>
    <title>Organizations in SLU</title>
</head>
<body>
  <div class="app">
     <aside class="leftbar" aria-label="Main navigation">
      <div class="brand">
        <div class="logo">SLU</div>
      </div>

      <nav class="left-nav" role="navigation" aria-label="Sidebar">
        <a href="../osas/calendar.html">
          <button class="circle-btn" title="Calendar" aria-label="Calendar">
            <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">

            </svg>
          </button>
        </a>

        <a href="../osas/orgs.html">
          <button class="circle-btn active" title="Organizations" aria-label="Organizations">
            <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0 4h2v-2H3v2zm12 0h2v-2h-2v2zm-6 0h2v-2h-2v2zm-6 0h2v-2H3v2zm0-4h2v-2H3v2zm6 0h2v-2H9v2zm6 0h2v-2h-2v2zm0-4h2v-2h-2v2zm-6 0h2v-2H9v2zm-6 0h2v-2H3v2zm12-4h2V7h-2v2zm-6 0h2V7H9v2zm-6 0h2V7H3v2zm12-4h2V3h-2v2zm-6 0h2V3H9v2zm-6 0h2V3H3v2z"/>
            </svg>
          </button>
        </a>
        
        <button class="circle-btn" title="Email" aria-label="Email">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
          </svg>
        </button>
        <button class="circle-btn" title="Form List" aria-label="Form List">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/>
          </svg>
        </button>
        <button class="circle-btn" title="View All Users" aria-label="View All Users">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M16 4c0-1.11.89-2 2-2s2 .89 2 2-.89 2-2 2-2-.89-2-2zm4 18v-6h2.5l-2.54-7.63A3.02 3.02 0 0 0 16.95 6h-2.2c-.79 0-1.53.43-1.92 1.13L10.5 16H7v8h2v-6h2.22l2.76-8.27c.12-.36.46-.61.85-.61h2.29c.31 0 .6.14.78.38L19 13.63V22h2zM0 20v-8h2v8H0zm6-12c0-1.66 1.34-3 3-3s3 1.34 3 3-1.34 3-3 3-3-1.34-3-3z"/>
          </svg>
        </button>
      </nav>
    </aside>
    <main class="main-area" role="main">
      <header class="header">
        <div class="greeting">
          <h1>Hello, OSAS</h1>
          <div class="muted">Here are all the student organizations inside of Saint Louis University</div>
        </div>

        <div class="top-actions">
          <div class="search-wrap">
  <button id="filterToggle" title="Filter" aria-label="Filter">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
      <path d="M10 18h4v-2h-4v2zm-7-8v2h18v-2H3zm3-6v2h12V4H6z"/>
    </svg>
  </button>

  <input id="searchInput" type="search" placeholder="Search an Organization" aria-label="Search an Organization" />
  <button id="searchClear" title="Clear" aria-label="Clear search">✕</button>

  <div id="filterMenu" class="filter-menu hidden">
    <button class="filter-item" data-filter="SEA">SEA</button>
    <button class="filter-item" data-filter="SAMCIS">SAMCIS</button>
    <button class="filter-item" data-filter="SONAHBS">SONAHBS</button>
    <button class="filter-item" data-filter="STELA">STELA</button>
    <button class="filter-item" data-filter="SOM">SOM</button>
    <button class="filter-item" data-filter="SOL">SOL</button>
    <button class="filter-item" data-filter="UNIVERSITY-WIDE">UNIVERSITY-WIDE</button>
    
    <div class="filter-clear">
            <button id="clearFilterBtn">Clear Filter</button>
      </div>
  </div>
</div>
         
          <div class="profile-header">
            <div class="profile-circle">M</div>
          </div>
        </div>
      </header>

      <table class="org-table">
        <thead>
          <tr>
            <th></th>
            <th>Organization</th>
            <th>School</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="orgTableBody"></tbody>
      </table>
</body>
</html>
