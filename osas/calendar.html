<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Calendar — Past Events</title>
  <link rel="stylesheet" href="../style/calendar.css" />
</head>
<body>
  <div class="app">
    <!-- Left circular sidebar -->
    <aside class="leftbar" aria-label="Main navigation">
      <div class="brand">
        <div class="logo">SLU</div>
      </div>

      <nav class="left-nav" role="navigation" aria-label="Sidebar">
        <a href="../osas/calendar.html">
          <button class="circle-btn active" title="Calendar" aria-label="Calendar">
            <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/>
            </svg>
          </button>
        </a>

        <a href="../osas/orgs.html">
          <button class="circle-btn" title="Organizations" aria-label="Organizations">
            <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0 4h2v-2H3v2zm12 0h2v-2h-2v2zm-6 0h2v-2h-2v2zm-6 0h2v-2H3v2zm0-4h2v-2H3v2zm6 0h2v-2H9v2zm6 0h2v-2h-2v2zm0-4h2v-2h-2v2zm-6 0h2v-2H9v2zm-6 0h2v-2H3v2zm12-4h2V7h-2v2zm-6 0h2V7H9v2zm-6 0h2V7H3v2zm12-4h2V3h-2v2zm-6 0h2V3H9v2zm-6 0h2V3H3v2z"/>
            </svg>
          </button>
        </a>
        
        <button class="circle-btn" title="Email" aria-label="Email">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
          </svg>
        </button>
        <button class="circle-btn" title="Form List" aria-label="Form List">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/>
          </svg>
        </button>
        <button class="circle-btn" title="View All Users" aria-label="View All Users">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M16 4c0-1.11.89-2 2-2s2 .89 2 2-.89 2-2 2-2-.89-2-2zm4 18v-6h2.5l-2.54-7.63A3.02 3.02 0 0 0 16.95 6h-2.2c-.79 0-1.53.43-1.92 1.13L10.5 16H7v8h2v-6h2.22l2.76-8.27c.12-.36.46-.61.85-.61h2.29c.31 0 .6.14.78.38L19 13.63V22h2zM0 20v-8h2v8H0zm6-12c0-1.66 1.34-3 3-3s3 1.34 3 3-1.34 3-3 3-3-1.34-3-3z"/>
          </svg>
        </button>
      </nav>
    </aside>

    <!-- Main area -->
    <main class="main-area" role="main">
      <header class="header">
        <div class="greeting">
          <h1>Hello, Admin</h1>
          <div class="muted">Here's what happened this month</div>
        </div>

        <div class="top-actions">
          <div class="search-wrap">
            <input id="searchInput" type="search" placeholder="Search past events..." aria-label="Search past events" />
            <button id="searchClear" title="Clear" aria-label="Clear search">✕</button>
          </div>
          <!-- Profile moved to header -->
          <div class="profile-header">
            <div class="profile-circle">M</div>
          </div>
        </div>
      </header>

      <div class="body">
        <!-- Calendar column -->
        <section class="calendar-column" aria-label="Calendar">
          <div class="calendar-head">
            <div class="month-block">
              <div class="month-year-linear">
                <span id="monthName" class="month-name">October</span>
                <span id="yearName" class="year-name">2025</span>
              </div>
            </div>

            <!-- Navigation controls -->
            <div class="nav-controls">
              <button id="prevBtn" class="icon-btn" aria-label="Previous month">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
                </svg>
              </button>
              <button id="todayBtn" class="btn-small">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/>
                </svg>
                Today
              </button>
              <button id="nextBtn" class="icon-btn" aria-label="Next month">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
                </svg>
              </button>
            </div>
          </div>

          <div id="calendarGrid" class="calendar-grid" aria-hidden="false">
            <!-- Week headers -->
            <div class="week">Sun</div>
            <div class="week">Mon</div>
            <div class="week">Tue</div>
            <div class="week">Wed</div>
            <div class="week">Thu</div>
            <div class="week">Fri</div>
            <div class="week">Sat</div>
            <!-- days injected by script.js -->
          </div>
        </section>

        <!-- Right panel: Past Events -->
        <aside class="right-panel" aria-label="Past events">
          <div class="panel-top">
            <h2>Past Events</h2>
            <div class="muted">History for selected month (click an event to view more)</div>
          </div>

          <!-- Fixed-size, scrollable events list -->
          <div id="eventsList" class="events-list" aria-live="polite" tabindex="0">
            <!-- Event cards injected by script.js -->
          </div>

          <div class="panel-footer muted small">Click an event to view details; click a day to focus its events.</div>
        </aside>
      </div>

      <footer class="footer muted">© <span id="curYear"></span> Admin Dashboard</footer>
    </main>
  </div>

  <!-- Slide-in detail panel + overlay -->
  <div id="overlay" class="overlay" tabindex="-1" aria-hidden="true"></div>
  <aside id="detailPanel" class="detail-panel" role="dialog" aria-hidden="true" aria-labelledby="detailTitle">
    <div class="detail-header">
      <div>
        <h3 id="detailTitle">Event Details</h3>
        <div id="detailMeta" class="muted small"></div>
      </div>
      <button id="detailClose" class="detail-close" aria-label="Close details">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
        </svg>
      </button>
    </div>

    <div id="detailBody" class="detail-body" tabindex="0">
      <!-- populated by script.js -->
    </div>
  </aside>

  <script src="../script/calendar.js"></script>
</body>
</html>
