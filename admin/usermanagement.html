<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Admin User Management</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="admin.css" />
    <script src="../admin/usermanagement.js" defer></script>
  </head>

  <body>
    <div class="app">
      <!-- Sidebar -->
      <aside class="leftbar">
        <div class="brand">
          <div class="logo">AD</div>
        </div>

        <nav class="left-nav">
          <a href="../admin/dashboard.html">
            <button class="circle-btn" title="Home (Analytics)">
              <img src="/Images/statistics.png" alt="Home" class="nav-icon" />
            </button>
          </a>

          <a href="../admin/usermanagement.html">
            <button class="circle-btn active" title="User Management">
              <img src="/Images/user_management.png" alt="User Management" class="nav-icon" />
            </button>
          </a>
        </nav>
      </aside>

      <!-- Main area -->
      <main class="main-area">
        <header class="header">
          <div class="greeting">
            <h1>Hello, Admin</h1>
            <div class="muted">
              Here are all the student organizations inside of Saint Louis University
            </div>
          </div>

          <div class="top-actions">
            <div class="search-wrap">
              <input id="searchInput" type="search" placeholder="Search an Organization" />
              <button id="searchClear" title="Clear">✕</button>
            </div>

            <div class="hide-filter">
              <button id="toggleFilters"><i class="fa-solid fa-filter"></i> Filters</button>
            </div>

            <div class="profile-header">
              <div class="profile-circle">A</div>
            </div>
          </div>
        </header>

        <!-- ✅ Add Organization Button -->
        <div class="top-right-action">
          <button id="addOrgBtn">+ Add Organization</button>
        </div>

        <!-- Filters -->
        <section id="filterSection" class="filters">
          <label>
            School:
            <select id="schoolFilter">
              <option value="">All</option>
              <option value="SAMCIS">SAMCIS</option>
              <option value="SON">SON</option>
              <option value="SEA">SEA</option>
            </select>
          </label>

          <label>
            Status:
            <select id="statusFilter">
              <option value="">All</option>
              <option value="Active">Active</option>
              <option value="Inactive">Inactive</option>
            </select>
          </label>

          <button id="addFilterBtn" type="button">+ Add Filter</button>
          <div id="extraFilters" class="extra-filters"></div>
        </section>

        <!-- Table -->
        <table class="org-table">
          <thead>
            <tr>
              <th><input type="checkbox" id="selectAll" /></th>
              <th>Logo</th>
              <th>Organization</th>
              <th>Email</th>
              <th>Status</th>
              <th>Role</th>
              <th>School</th>
              <th>Programs</th>
              <th>Last Active</th>
              <th> </th>
            </tr>
          </thead>
          <tbody id="orgTableBody"></tbody>
        </table>

        <div class="pagination-controls">
          <label>
            Rows per page:
            <select id="rowsPerPage">
              <option value="3">3</option>
              <option value="5" selected>5</option>
              <option value="10">10</option>
            </select>
          </label>
          <div id="pagination"></div>
        </div>

        <footer class="footer muted">
          © <span id="curYear"></span> Admin User Management
        </footer>
      </main>
    </div>

    <!-- ✅ Edit/Delete Modal -->
    <div id="confirmModal" class="modal">
      <div class="modal-content">
        <h3 id="confirmTitle"></h3>
        <div class="modal-buttons">
          <button id="confirmYes" class="confirm-btn">Yes</button>
          <button id="confirmCancel" class="cancel-btn">Cancel</button>
        </div>
      </div>
    </div>

    <!-- ✅ Add Organization Modal -->
    <div id="addOrgModal" class="modal">
      <div class="addorg-modal-content">
        <h2>Add Organization</h2>

        <div id="googleSection">
          <h3>Sign in with Google</h3>
          <button id="signInGoogleBtn">
            <i class="fa-brands fa-google"></i> Sign in with Google
          </button>
        </div>

        <div class="divider">or</div>

        <div id="createAccountSection">
          <h3>Create New Account</h3>
          <button>Create Account</button>
        </div>

        <div class="modal-buttons" style="margin-top: 25px;">
          <button id="closeAddOrg" class="cancel-btn">Close</button>
        </div>
      </div>
    </div>

    <!-- ✅ Second Modal: Google Email Input -->
    <div id="googleEmailModal" class="modal">
      <div class="google-modal-content">
        <h3>Enter Organization Email</h3>
        <input type="email" id="orgEmailInput" placeholder="organization@gmail.com" />
        <div class="modal-buttons">
          <button id="googleNext" class="confirm-btn">Next</button>
          <button id="cancelGoogle" class="cancel-btn">Cancel</button>
        </div>
      </div>
    </div>

    <!-- ✅ Create New Organization Modal (modernized) -->
    <div id="createOrgModal" class="createorg-modal">
      <div class="createorg-modal-content">
        <h2>Create New Organization</h2>

        <form id="createOrgForm">
          <div class="createorg-modal-row">
            <label>Organization Name</label>
            <input type="text" id="orgName" placeholder="Enter organization name" />
          </div>

          <div class="createorg-modal-row">
            <label>Acronym</label>
            <input type="text" id="orgAcronym" placeholder="Enter acronym" />
          </div>

          <div class="createorg-modal-row">
            <label>Official Email</label>
            <input type="email" id="orgEmail" placeholder="Enter official email" />
          </div>

          <div class="createorg-modal-row">
            <label>Applicant Name</label>
            <input type="text" id="applicantName" placeholder="Enter applicant name" />
          </div>

          <div class="createorg-modal-row">
            <label>Adviser Names (comma separated)</label>
            <input type="text" id="adviserNames" placeholder="e.g., Dr. Smith, Prof. Lee" />
          </div>

          <div class="createorg-modal-row">
            <label>School</label>
            <input type="text" id="orgSchool" placeholder="Enter school" />
          </div>

          <div class="createorg-modal-row">
            <label>Category</label>
            <input type="text" id="orgCategory" placeholder="Enter category" />
          </div>

          <div class="createorg-modal-row">
            <label>Organization Type</label>
            <input type="text" id="orgType" placeholder="Enter type (e.g., Academic)" />
          </div>

          <div class="createorg-modal-row">
            <label>Applicant Position</label>
            <input type="text" id="applicantPosition" placeholder="Enter position" />
          </div>

          <div class="createorg-modal-row">
            <label>Applicant Email</label>
            <input type="email" id="applicantEmail" placeholder="Enter applicant email" />
          </div>

          <div class="createorg-modal-row">
            <label>Video Link</label>
            <input type="text" id="videoLink" placeholder="Enter Google Drive link" />
          </div>

          <div class="createorg-modal-row">
            <label>Status</label>
            <select id="orgStatus">
              <option value="pending">Pending</option>
              <option value="accepted">Accepted</option>
              <option value="revision">Needs Revision</option>
            </select>
          </div>

          <div class="createorg-modal-row">
            <label>Remarks</label>
            <textarea id="orgRemarks" placeholder="Enter remarks (optional)"></textarea>
          </div>

          <div class="createorg-modal-actions">
            <button type="button" id="saveOrgBtn" class="btn-outlined">Save</button>
            <button type="button" id="cancelCreateOrg" class="reset-btn">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <!-- All modal and add-org scripts moved to external admin/usermanagement.js -->
  </body>
</html>
