<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - SLU OrgDesk Admin</title>
    <link rel="stylesheet" href="../style/usermanagement.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="icon" type="image/png" href="../Images/Icon.png" sizes="32x32">
</head>

<body>
    <div class="app">
        <!-- Left Sidebar -->
        <aside class="leftbar">
            <div class="brand">
                <img src="../Images/Icon.png" alt="SLU Logo" class="logo">
            </div>

            <nav class="left-nav">
                <a href="../admin/dashboard.html" class="circle-btn">
                    <img src="../Images/statisctics.png" alt="" height="16" width="16">
                </a>
                <a href="../admin/orgmanagement.html" class="circle-btn">
                    <img src="../Images/osas/group.png" alt="" height="16" width="16">
                </a>
                <a href="../admin/usermanagement.html" class="circle-btn active">
                    <img src="../Images/osas/user.png" alt="" height="16" width="16">
                </a>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <div class="main-area">
            <!-- Header -->
            <div class="header">
                <div class="greeting">
                    <h1>Hello, Admin</h1>
                    <div class="muted">Manage user accounts and permissions</div>
                </div>

                <!-- Top Actions -->
                <div class="top-actions">
                    <button id="addUserBtn" class="add-org-header-btn">
                        <i class="fas fa-plus"></i>
                        Add User
                    </button>

                    <!-- Search and Filter Section -->
                    <div class="search-wrap">
                        <button id="filterToggle" title="Filter">
                            <img src="../Images/osas/filter.png" alt="filter-icon" class="">
                        </button>

                        <!-- Search input -->
                        <input type="search" id="searchInput" placeholder="Search">

                        <!-- Filter Menu (styled like orgmanagement) -->
                        <div id="filterMenu" class="filter-menu hidden">
                            <div class="filter-group" style="margin-bottom:10px;">
                                <div style="font-weight:600; margin-bottom:6px;">Roles</div>
                                <button class="filter-item" data-type="role" data-filter="">All Roles</button>
                                <button class="filter-item" data-type="role"
                                    data-filter="Organization">Organization</button>
                                <button class="filter-item" data-type="role" data-filter="OSAS">OSAS</button>
                                <button class="filter-item" data-type="role" data-filter="Admin">Admin</button>
                            </div>

                            <div class="filter-group" style="margin-bottom:10px;">
                                <div style="font-weight:600; margin-bottom:6px;">Schools</div>
                                <button class="filter-item" data-type="school" data-filter="">All Schools</button>
                                <button class="filter-item" data-type="school" data-filter="SAMCIS">SAMCIS</button>
                                <button class="filter-item" data-type="school" data-filter="SEA">SEA</button>
                                <button class="filter-item" data-type="school" data-filter="STELA">STELA</button>
                                <button class="filter-item" data-type="school" data-filter="SOL">SOL</button>
                                <button class="filter-item" data-type="school" data-filter="SOM">SOM</button>
                                <button class="filter-item" data-type="school" data-filter="SONAHBS">SONAHBS</button>
                            </div>

                            <div class="filter-clear">
                                <button id="clearFilterBtn">Clear Filters</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Card list for mobile view -->
            <div id="userCardList" class="card-list"></div>

            <!-- User Table -->
            <div class="body">
                <table class="org-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>School</th>
                            <th>Status</th>
                            <th> </th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <!-- User rows will be inserted here by JavaScript -->
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div class="footer">
                <div class="pagination-controls">
                    <div class="rows-per-page">
                        <label>Rows per page:</label>
                        <select id="rowsPerPage">
                            <option value="5">5</option>
                            <option value="10">10</option>
                            <option value="25">25</option>
                            <option value="50">50</option>
                        </select>
                    </div>
                    <div id="pagination"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Role Selection Modal -->
    <div class="modal" id="roleModal">
        <div class="modal-content">
            <h2>Add User</h2>
            <p style="text-align: center; margin-bottom: 20px; color: #666;">Select user role:</p>
            <div class="role-options">
                <button class="role-btn" data-role="OSAS">
                    <i class="fas fa-user-shield"></i>
                    Add OSAS
                </button>
                <button class="role-btn" data-role="Organization">
                    <i class="fas fa-sitemap"></i>
                    Add Organization
                </button>
                <button class="role-btn" data-role="Admin">
                    <i class="fas fa-cog"></i>
                    Add Admin
                </button>
            </div>
            <div class="modal-buttons">
                <button class="cancel-btn" onclick="closeRoleModal()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- User Form Modal -->
    <div class="modal" id="userModal">
        <div class="modal-content">
            <h2 id="modalTitle">Add New User</h2>
            <form id="userForm">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter the name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter the email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter the password" required>
                </div>
                <div class="form-group">
                    <label for="role">Role</label>
                    <select id="role" name="role" required disabled>
                        <option value="">Select role</option>
                        <option value="Organization">Organization</option>
                        <option value="OSAS">OSAS</option>
                        <option value="Admin">Admin</option>
                    </select>
                </div>

                <!-- Organization-specific fields -->
                <div class="role-specific-fields" id="organizationFields">
                    <div class="form-group">
                        <label for="logoURL">Logo URL</label>
                        <input type="text" id="logoURL" name="logoURL" placeholder="Enter logo URL">
                    </div>
                    <div class="form-group">
                        <label for="school">School</label>
                        <select id="school" name="school">
                            <option value="SAMCIS">SAMCIS</option>
                            <option value="SEA">SEA</option>
                            <option value="STELA">STELA</option>
                            <option value="SOL">SOL</option>
                            <option value="SOM">SOM</option>
                            <option value="SONAHBS">SONAHBS</option>
                        </select>
                    </div>
                    <div class="form-group">

                    </div>
                    <div class="form-group">

                    </div>
                </div>

                <!-- OSAS-specific fields -->
                <div class="role-specific-fields" id="osasFields">
                    <div class="form-group">

                    </div>
                </div>

                <!-- Admin-specific fields -->
                <div class="role-specific-fields" id="adminFields">
                    <div class="form-group">

                    </div>
                </div>

                <div class="modal-buttons">
                    <button type="submit" class="confirm-btn">Save</button>
                    <button type="button" class="cancel-btn" onclick="closeUserModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal" id="deleteModal">
        <div class="modal-content">
            <h2>Delete User</h2>
            <p>Are you sure you want to delete this user? This action cannot be undone.</p>
            <div class="modal-buttons">
                <button class="delete-btn-modal" onclick="confirmDelete()">Delete</button>
                <button class="cancel-btn" onclick="closeDeleteModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script src="../script/usermanagement.js" defer></script>
</body>

</html>
