<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin View Management</title>

  <!-- Font (system fallback) + Font Awesome for nicer icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-jQf6B8VQw5s3pQKxZ0vZk4bqf6tF6y5r8i8P6b1GxZ9l1E2YQk3xG3k2y3P1X9c4n6b7R8s9T0wW3e4F5g==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="app">
    <!-- Left circular sidebar -->
    <aside class="leftbar" aria-label="Main navigation">
      <div class="brand">
        <div class="logo">AD</div>
      </div>

      <nav class="left-nav" role="navigation" aria-label="Admin Sidebar">
        <button class="circle-btn" title="Home (Analytics)" aria-label="Home (Analytics)" onclick="window.location.href='home.html'"></button><i class="fa-solid fa-chart-column"></i></button>
        <button class="circle-btn" title="User Management" aria-label="User Management" onclick="window.location.href='user_management.html'"><i class="fa-solid fa-user-gear"></i></button>
        <button class="circle-btn" title="Organization Management" aria-label="Organization Management" onclick="window.location.href='org_management.html'"><i class="fa-solid fa-building-user"></i></button>        
        <button class="circle-btn" title="Create Organization Account" aria-label="Create Organization Account" onclick="window.location.href='dashboard.html'"><i class="fa-solid fa-user-plus"></i></button>        
        <button class="circle-btn" title="Whitelist Organization Accounts" aria-label="Whitelist Organization Accounts" onclick="window.location.href='whitelist_org_accounts.html'"><i class="fa-solid fa-user-check"></i></button>
        <button class="circle-btn" title="System Alerts & Reminders" aria-label="System Alerts & Reminders" onclick="window.location.href='system_reminder.html'"><i class="fa-solid fa-bell-gear"></i></button>
        <button class="circle-btn" title="View All Users" aria-label="View All Users" onclick="window.location.href='view_users.html'"><i class="fa-solid fa-users"></i></button>
      </nav>
    </aside>

    <!-- Main area -->
    <main class="main-area" role="main">
      <header class="header">
        <div class="greeting">
          <h1>Hello, Admin</h1>
          <div class="muted">View Management html</div>
        </div>

        <div class="top-actions">
          <div class="profile-header">
            <div class="profile-circle">M</div>
          </div>
        </div>
      </header>

      <footer class="footer muted">© <span id="curYear"></span> Admin View Management</footer>
    </main>
  </div>
</body>
</html>
