# =============================================================================
# Cloud Build - builds and pushes both OrgDesk images to Artifact Registry.
#
#   gcloud builds submit --config deploy/cloudbuild.yaml \
#     --substitutions=_REGION=asia-southeast1,_AR_REPO=orgdesk,_TAG=$(git rev-parse --short HEAD)
#
# Normally invoked for you by deploy/deploy.sh.
#
# Requires an Artifact Registry repository named ${_AR_REPO} in ${_REGION}:
#   gcloud artifacts repositories create orgdesk \
#     --repository-format=docker --location=asia-southeast1
# =============================================================================

substitutions:
  _REGION: asia-southeast1
  _AR_REPO: orgdesk
  _TAG: latest

steps:
  # ---------------------------------------------------------------------------
  # Web tier: Apache + mod_php + the mongodb PECL extension.
  # The extension is compiled from source, so this step takes a few minutes.
  # ---------------------------------------------------------------------------
  - id: build-web
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=Dockerfile.web
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/orgdesk-web:${_TAG}
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/orgdesk-web:latest
      - .

  # ---------------------------------------------------------------------------
  # API tier: Node.js / Express.
  # ---------------------------------------------------------------------------
  - id: build-api
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=Dockerfile.node
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/orgdesk-api:${_TAG}
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/orgdesk-api:latest
      - .

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/orgdesk-web:${_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/orgdesk-web:latest
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/orgdesk-api:${_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/orgdesk-api:latest

options:
  machineType: E2_HIGHCPU_8
  # Avoids needing a user-provided GCS logs bucket.
  logging: CLOUD_LOGGING_ONLY

timeout: 2400s
