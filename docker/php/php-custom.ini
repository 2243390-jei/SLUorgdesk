; =============================================================================
; SLU OrgDesk - PHP runtime tuning
; Copied to /usr/local/etc/php/conf.d/zz-orgdesk.ini
; =============================================================================

; --- Upload limits ------------------------------------------------------------------
; FileUploadService enforces a 50 MB per-file ceiling and accepts multi-file
; submissions, so post_max_size must exceed upload_max_filesize.
upload_max_filesize = 50M
post_max_size       = 200M
max_file_uploads    = 20

; --- Execution ----------------------------------------------------------------------
memory_limit        = 256M
max_execution_time  = 120
max_input_time      = 120

; --- Sessions -----------------------------------------------------------------------
; 24h lifetime matches the Express session maxAge in node-server/config/session.js.
session.gc_maxlifetime   = 86400
session.cookie_lifetime  = 86400
session.cookie_httponly  = 1
session.cookie_samesite  = Lax
; Set to 1 by the entrypoint when the site is served over HTTPS (Cloud Run).
session.cookie_secure    = 0

; --- Errors / exposure --------------------------------------------------------------
; Errors go to stderr so Cloud Run Logging captures them.
display_errors      = Off
log_errors          = On
error_log           = /proc/self/fd/2
expose_php          = Off

; --- Timezone -----------------------------------------------------------------------
date.timezone = Asia/Manila
